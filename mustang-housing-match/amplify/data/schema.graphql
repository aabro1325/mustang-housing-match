# Shared List API (decision: issue #10). Every field is reachable only through the identity pool's IAM roles;
# the resolvers decide per list by checking the caller's MEMBER# record.

type Member {
  id: String!
  displayName: String!
  role: String!
  joinedAt: String!
}

type SharedList {
  id: String!
  name: String!
  ownerId: String!
  createdAt: String!
  members: [Member!]!
}

type CreatedList {
  list: SharedList!
  inviteToken: String!
}

type SavedListing {
  id: String!
  listId: String!
  listing: AWSJSON!
  commute: AWSJSON
  status: String!
  finalist: Boolean!
  tourAt: String
  landlordQuestions: [String!]
  notes: AWSJSON
  fitScores: AWSJSON
  addedBy: String!
  createdAt: String!
  updatedAt: String!
  version: Int!
}

type ListChange {
  listId: String!
  kind: String!
  savedListingId: String
  actorId: String!
  at: String!
  savedListing: SavedListing
}

type Query {
  myLists: [SharedList!]!
  getList(listId: String!): SharedList
  listSavedListings(listId: String!): [SavedListing!]!
}

type Mutation {
  createList(name: String!, inviteToken: String!, displayName: String!): CreatedList
  joinList(listId: String!, inviteToken: String!, displayName: String!): ListChange
  rotateInviteToken(listId: String!, newToken: String!): CreatedList
  removeMember(listId: String!, memberId: String!): ListChange
  leaveList(listId: String!): ListChange
  addSavedListing(listId: String!, listing: AWSJSON!, commute: AWSJSON, landlordQuestions: [String!]): ListChange
  updateSavedListing(listId: String!, savedListingId: String!, patch: AWSJSON!): ListChange
  removeSavedListing(listId: String!, savedListingId: String!): ListChange
  addNote(listId: String!, savedListingId: String!, text: String!): ListChange
  setFitScore(listId: String!, savedListingId: String!, score: Int!): ListChange
}

type Subscription {
  onListChange(listId: String!): ListChange
    @aws_subscribe(mutations: ["joinList", "removeMember", "leaveList", "addSavedListing", "updateSavedListing", "removeSavedListing", "addNote", "setFitScore"])
}
